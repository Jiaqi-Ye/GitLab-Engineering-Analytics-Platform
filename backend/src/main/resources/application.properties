spring.application.name=gitlab-analytics
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gitlab_analytics?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:analytics}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.error.include-message=never
server.error.include-stacktrace=never
analytics.gitlab.mode=${GITLAB_MODE:demo}
analytics.gitlab.base-url=${GITLAB_BASE_URL:https://git.doit.wisc.edu}
analytics.gitlab.project-id=${GITLAB_PROJECT_ID:158108}
analytics.gitlab.project-name=${GITLAB_PROJECT_NAME:T29 / Project_29}
analytics.gitlab.project-url=${GITLAB_PROJECT_URL:}
analytics.gitlab.token=${GITLAB_TOKEN:}
